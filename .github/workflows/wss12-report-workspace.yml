name: WSS12 What Stars Say Report Workspace
on:
  pull_request:
    branches: [main]
    paths:
      - 'what-stars-say.html'
      - 'assets/js/drishvara-report-workspace.mjs'
      - 'assets/js/drishvara-chart-diagram.mjs'
      - 'assets/css/drishvara-report-workspace.css'
      - 'data/demo/what-stars-say-report.json'
      - 'scripts/build-wss-report-demo.mjs'
      - 'tests/wss12-*'
      - '.github/workflows/wss12-report-workspace.yml'
permissions:
  contents: read
jobs:
  report-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Verify reproducible synthetic report and unchanged qualification gates
        run: |
          node scripts/build-wss-report-demo.mjs
          git diff --exit-code -- data/demo/what-stars-say-report.json assets/js/drishvara-chart-diagram.mjs
          node tests/wss12-report-workspace.mjs
          node --check assets/js/drishvara-report-workspace.mjs
          node scripts/validate-drishvara-frontend-migration.mjs
      - name: Install browser QA and Hindi fonts
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
      - name: Start candidate preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wss12-server.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/what-stars-say.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node tests/wss12-report-workspace-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wss12-report-workspace
          path: wss12-workspace-qa/
          retention-days: 7
