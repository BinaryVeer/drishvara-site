name: WSS05 WSS06 Structured Context and Transit Candidate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/wss05-06-context-and-transits-candidate.mjs'
      - 'tests/wss05-06-context-and-transits.mjs'
      - 'data/methodology/jyotisha/wss05-06-context-source-register-20261105.json'
      - '.github/workflows/wss05-06-candidate.yml'
permissions:
  contents: read
jobs:
  context-and-transit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned astronomy dependency
        run: npm ci --ignore-scripts
      - name: Test transits, natal domains, period maths and regressions
        run: |
          node --check scripts/lib/wss05-06-context-and-transits-candidate.mjs
          node tests/wss03-natal-candidate.mjs
          node tests/wss03-independent-reference.mjs
          node tests/wss04-varga-vimshottari.mjs
          node tests/wss05-06-context-and-transits.mjs
          node scripts/validate-drishvara-frontend-migration.mjs
      - name: Assert no current public application changed
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/wss05-diff.txt
          if grep -E '^(index.html|what-stars-say.html|panchang.html|assets/js/|supabase/|scripts/lib/ag74)' /tmp/wss05-diff.txt; then
            echo 'WSS05/06 is source-qualification only; public modules changed.'
            exit 1
          fi
