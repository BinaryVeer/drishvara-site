name: WSS08 Audited English Hindi Private Kundali
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/wss08-audited-bilingual-view.mjs'
      - 'scripts/wss07-private-preview-client.mjs'
      - 'tests/wss08-audited-bilingual-view.mjs'
      - 'tests/wss07-bilingual-private-preview.mjs'
      - '.github/workflows/wss08-audited-view.yml'
permissions:
  contents: read
jobs:
  audited-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned astronomy runtime
        run: npm ci --ignore-scripts
      - name: Test WSS02–WSS08 numeric and audited view contracts
        run: |
          node --check scripts/lib/wss08-audited-bilingual-view.mjs
          node --check scripts/wss07-private-preview-client.mjs
          node tests/wss02-birth-timezone.mjs
          node tests/wss03-independent-reference.mjs
          node tests/wss04-varga-vimshottari.mjs
          node tests/wss05-classical-rule-evidence.mjs
          node tests/wss06-context-and-transits.mjs || test ! -f tests/wss06-context-and-transits.mjs
          node tests/wss07-kundali-report-candidate.mjs
          node tests/wss07-month-year-transit.mjs
          node tests/wss08-natal-precision.mjs
          node tests/wss08-audited-bilingual-view.mjs
          node scripts/validate-drishvara-frontend-migration.mjs
      - name: Install staging-only browser tooling
        run: npm install --no-save --no-package-lock --ignore-scripts esbuild@0.25.5 playwright-core@1.56.1
      - name: Build isolated local-only preview
        run: |
          mkdir -p wss07-preview-qa
          cp tests/fixtures/wss07-private-preview.html.txt wss07-preview-qa/index.html
          ./node_modules/.bin/esbuild scripts/wss07-private-preview-client.mjs --bundle --platform=browser --format=esm --target=es2022 --outfile=wss07-preview-qa/wss07-private-preview-bundle.js
          python3 -m http.server 8899 --directory wss07-preview-qa --bind 127.0.0.1 >/tmp/wss08-preview.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8899/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/wss08-preview.log
          exit 1
      - name: Verify no precise chart labels or Dasha dates slip through
        run: node tests/wss07-bilingual-private-preview.mjs
      - name: Must not alter active public pages or Supabase
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/wss08-audited-diff
          if grep -E '^(index.html|what-stars-say.html|panchang.html|assets/js/|assets/css/|supabase/|scripts/lib/ag74|package.json|package-lock.json)' /tmp/wss08-audited-diff; then
            echo 'Audited private view must not touch public runtime or dependencies'
            exit 1
          fi
      - name: Preserve EN/HI screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wss08-audited-bilingual-preview
          path: wss07-preview-qa/
          if-no-files-found: warn
          retention-days: 7
