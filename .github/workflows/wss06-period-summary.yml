name: WSS06 Bilingual Month and Year Transit QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/wss07-period-transit-summary.mjs'
      - 'scripts/wss07-private-preview-client.mjs'
      - 'tests/wss07-month-year-transit.mjs'
      - 'tests/wss07-bilingual-private-preview.mjs'
      - '.github/workflows/wss06-period-summary.yml'
permissions:
  contents: read
jobs:
  calendar-transit-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned ephemeris
        run: npm ci --ignore-scripts
      - name: Validate Gregorian month-year, leap dates and calculation invariants
        run: |
          node --check scripts/lib/wss07-period-transit-summary.mjs
          node --check scripts/wss07-private-preview-client.mjs
          node tests/wss03-independent-reference.mjs
          node tests/wss04-varga-vimshottari.mjs
          node tests/wss05-06-context-and-transits.mjs
          node tests/wss05-classical-rule-evidence.mjs
          node tests/wss07-month-year-transit.mjs
          node scripts/validate-drishvara-frontend-migration.mjs
      - name: Install staging-only tooling
        run: npm install --no-save --no-package-lock --ignore-scripts esbuild@0.25.5 playwright-core@1.56.1
      - name: Build and serve local-only bilingual preview
        run: |
          mkdir -p wss07-preview-qa
          cp tests/fixtures/wss07-private-preview.html.txt wss07-preview-qa/index.html
          ./node_modules/.bin/esbuild scripts/wss07-private-preview-client.mjs --bundle --platform=browser --format=esm --target=es2022 --outfile=wss07-preview-qa/wss07-private-preview-bundle.js
          python3 -m http.server 8899 --directory wss07-preview-qa --bind 127.0.0.1 >/tmp/wss06-preview.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8899/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/wss06-preview.log
          exit 1
      - name: Verify English/Hindi month/year UX on 1440, 390 and 320 px
        run: node tests/wss07-bilingual-private-preview.mjs
      - name: Must not change any public runtime routes
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/wss06-files
          if grep -E '^(index.html|what-stars-say.html|panchang.html|assets/js/|assets/css/|supabase/|scripts/lib/ag74)' /tmp/wss06-files; then
            echo 'WSS06 sampled transit staging cannot alter published public modules'
            exit 1
          fi
      - name: Keep browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wss06-bilingual-month-year
          path: wss07-preview-qa/
          if-no-files-found: warn
          retention-days: 7
