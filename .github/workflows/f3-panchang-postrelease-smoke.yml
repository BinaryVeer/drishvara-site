name: F3 Panchang production smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/f3-panchang-postrelease-smoke.mjs'
      - '.github/workflows/f3-panchang-postrelease-smoke.yml'
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify live deployment
        run: node tests/f3-panchang-postrelease-smoke.mjs
      - name: Retain read-only browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3-panchang-prod-smoke
          path: f3-prod-smoke/
          if-no-files-found: warn
          retention-days: 7
