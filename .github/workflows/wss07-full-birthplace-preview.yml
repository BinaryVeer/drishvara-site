name: WSS07 Governed Birth Place Full Preview UX
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/wss07-approved-birthplace-dom.mjs'
      - 'scripts/lib/wss07-approved-birthplace-catalog.mjs'
      - 'scripts/wss07-private-preview-client.mjs'
      - 'tests/fixtures/wss07-private-preview.html.txt'
      - 'tests/wss07-bilingual-private-preview.mjs'
      - '.github/workflows/wss07-full-birthplace-preview.yml'
permissions:
  contents: read
jobs:
  complete-approved-place-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned ephemeris
        run: npm ci --ignore-scripts
      - name: Verify 3266-place approval and natal accuracy
        run: |
          node --check scripts/lib/wss07-approved-birthplace-dom.mjs
          node --check scripts/wss07-private-preview-client.mjs
          node tests/wss07-approved-birthplace-catalog.mjs
          node tests/wss02-birth-timezone.mjs
          node tests/wss03-independent-reference.mjs
          node tests/wss04-varga-vimshottari.mjs
          node tests/wss08-natal-precision.mjs
          node tests/wss08-audited-bilingual-view.mjs
          node scripts/validate-drishvara-frontend-migration.mjs
      - name: Install staging-only browser tools
        run: npm install --no-save --no-package-lock --ignore-scripts esbuild@0.25.5 playwright-core@1.56.1
      - name: Build isolated private preview
        run: |
          mkdir -p wss07-preview-qa
          cp tests/fixtures/wss07-private-preview.html.txt wss07-preview-qa/index.html
          ./node_modules/.bin/esbuild scripts/wss07-private-preview-client.mjs --bundle --platform=browser --format=esm --target=es2022 --outfile=wss07-preview-qa/wss07-private-preview-bundle.js
          python3 -m http.server 8899 --directory wss07-preview-qa --bind 127.0.0.1 >/tmp/wss07-locations.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8899/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/wss07-locations.log
          exit 1
      - name: Test EN/HI catalog, aliases, selection, name consent, privacy and fallback
        run: node tests/wss07-bilingual-private-preview.mjs
      - name: No deployed API, route, account or static catalog changes
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/wss07-place-diff
          if grep -E '^(index.html|what-stars-say.html|panchang.html|assets/js/|assets/css/|supabase/|data/knowledge-base/location-intelligence/production/|package.json|package-lock.json)' /tmp/wss07-place-diff; then
            echo 'Stage-only catalog integration cannot change live app or Supabase'
            exit 1
          fi
      - name: Store staging browser screenshots and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wss07-full-catalog-bilingual-browser
          path: wss07-preview-qa/
          if-no-files-found: warn
          retention-days: 7
