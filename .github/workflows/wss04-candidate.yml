name: WSS04 Varga and Vimshottari Candidate Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/wss04-varga-vimshottari-candidate.mjs'
      - 'tests/wss04-varga-vimshottari.mjs'
      - 'data/methodology/jyotisha/wss04-*.json'
      - '.github/workflows/wss04-candidate.yml'
permissions:
  contents: read
jobs:
  varga-dasha-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned ephemeris
        run: npm ci --ignore-scripts
      - name: Independent mathematics and baseline regressions
        run: |
          node --check scripts/lib/wss04-varga-vimshottari-candidate.mjs
          node tests/wss02-birth-timezone.mjs
          node tests/wss03-natal-candidate.mjs
          node tests/wss03-independent-reference.mjs
          node tests/wss04-varga-vimshottari.mjs
          node scripts/validate-drishvara-frontend-migration.mjs
      - name: Confirm no public runtime modifications
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/wss04-changed
          if grep -E '^(index.html|what-stars-say.html|panchang.html|assets/js/|supabase/|scripts/lib/ag74)' /tmp/wss04-changed; then
            echo 'WSS04 must not change production before source QA'
            exit 1
          fi
